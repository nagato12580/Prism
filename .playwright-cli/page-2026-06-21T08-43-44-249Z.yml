                    - generic [ref=e997]: topic_member
                  - generic [ref=e998]:
                    - generic [ref=e999]:
                      - img [ref=e1000]
                      - text: about
                    - generic [ref=e1002]: 微调成功的基本判断标准包括：核心指标比基线提升、多次训练波动小、典型样本正确、线上无崩坏、少数类指标不恶化、推理速度和成本可接受。
                    - generic [ref=e1003]: topic_member
                  - generic [ref=e1004]:
                    - generic [ref=e1005]:
                      - img [ref=e1006]
                      - text: about
                    - generic [ref=e1008]: 批量预测时应注意使用batch推理、设置max_length、避免一次性加载大文件、保存预测结果和低置信度样本供人工复核。
                    - generic [ref=e1009]: topic_member
                  - generic [ref=e1010]:
                    - generic [ref=e1011]:
                      - img [ref=e1012]
                      - text: about
                    - generic [ref=e1014]: 更严格的成功标准包括验证集和测试集指标接近、Macro F1和关键类别Recall达标、错误样本可解释、人工抽检通过、灰度上线稳定。
                    - generic [ref=e1015]: topic_member
                  - generic [ref=e1016]:
                    - generic [ref=e1017]:
                      - img [ref=e1018]
                      - text: about
                    - generic [ref=e1020]: 评估分类模型时应使用混淆矩阵，因为可以揭示类别混淆问题。
                    - generic [ref=e1021]: topic_member
                  - generic [ref=e1022]:
                    - generic [ref=e1023]:
                      - img [ref=e1024]
                      - text: about
                    - generic [ref=e1026]: 评估检查清单包括：是否看了Accuracy、Precision、Recall、F1、混淆矩阵，是否和基线比较，是否分析错误样本，是否关注关键类别，是否单独测试边界样本。
                    - generic [ref=e1027]: topic_member
                  - generic [ref=e1028]:
                    - generic [ref=e1029]:
                      - img [ref=e1030]
                      - text: about
                    - generic [ref=e1032]: 推理检查清单包括：单条预测是否正确、批量预测是否稳定、低置信度样本是否兜底、空输入和超长输入是否处理、输出格式是否稳定、推理速度是否满足业务要求。
                    - generic [ref=e1033]: topic_member
                  - generic [ref=e1034]:
                    - generic [ref=e1035]:
                      - img [ref=e1036]
                      - text: about
                    - generic [ref=e1038]: 当发现混淆矩阵问题后，应检查标签定义重叠、错标、样本区分性、prompt或输入字段。
                    - generic [ref=e1039]: topic_member
                  - generic [ref=e1040]:
                    - generic [ref=e1041]:
                      - img [ref=e1042]
                      - text: about
                    - generic [ref=e1044]: 上线检查清单包括：是否灰度发布、是否保留回滚方案、是否监控线上指标、是否收集错例、是否建立持续迭代数据闭环。
                    - generic [ref=e1045]: topic_member
                  - generic [ref=e1046]:
                    - generic [ref=e1047]:
                      - img [ref=e1048]
                      - text: about
                    - generic [ref=e1050]: 评估时一定要看混淆矩阵，以分析模型具体分类混淆情况。
                    - generic [ref=e1051]: topic_member
