                - generic [ref=e422]: 内容摘要
                - paragraph [ref=e423]: "## 项目概述 MiniMind-O是一个完全开源的多模态（Omni）模型训练项目，参数规模约0.1B。它旨在降低多模态模型的门槛，使研究者或爱好者能够在消费级硬件上从零训练一个支持文本、语音、图像输入并输出文本和流式语音的模型。 ## 训练与部署 项目提供了完整的代码、预训练权重以及两套训练数据集（mini和full）。其中mini数据集可在单张RTX 3090上约2小时完成完整的训练流程，极大地降低了硬件和时间成本。 ## 核心功能 - **语音对话**：支持与模型进行语音交互。 - **图像理解**：能够理解输入图像的内容。 - **流式语音生成**：模型能够实时生成语音输出。 - **实时打断**：在对话过程中可随时打断模型说话。 - **近似双工交互**：支持类似人类对话的双向同时交流。 - **音色克隆**：能够模仿特定人的音色进行语音输出。 - **电话模式WebUI**：提供模拟电话界面的Web用户界面。 ## 开源资源 项目完全开源，包括代码、权重、训练数据，技术报告已发布在arXiv上，方便社区复现、改进和应用。"
