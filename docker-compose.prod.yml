services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-CHANGE-ME}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-prism_db}"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-CHANGE-ME}"]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data

  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - etcd_data:/etcd

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-minioadmin}"
    command: minio server /minio_data
    volumes:
      - minio_data:/minio_data

  milvus:
    image: milvusdb/milvus:v2.4.0
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    depends_on:
      - etcd
      - minio
    volumes:
      - milvus_data:/var/lib/milvus

  neo4j:
    image: neo4j:5.28.1
    environment:
      NEO4J_AUTH: "${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:-change-me}"
      NEO4J_initial_dbms_default__database: "${NEO4J_DATABASE:-neo4j}"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  attu:
    image: zilliz/attu:v2.4
    ports:
      - "8000:3000"
    depends_on:
      - milvus

  elasticsearch:
    build: ./docker/es
    image: prism-es-ik:8.17.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=${ES_JAVA_OPTS:--Xms1g -Xmx1g}
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

  engine:
    build:
      context: .
      dockerfile: docker/engine.Dockerfile
      args:
        PIP_INDEX_URL: "${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}"
    env_file:
      - .env
    environment:
      DATABASE_URL: "mysql+pymysql://root:${MYSQL_ROOT_PASSWORD:-CHANGE-ME}@mysql:3306/${MYSQL_DATABASE:-prism_db}?charset=utf8mb4"
      REDIS_URL: "redis://redis:6379/0"
      MILVUS_HOST: "milvus"
      MILVUS_PORT: "19530"
      NEO4J_URI: "${NEO4J_URI:-bolt://neo4j:7687}"
      NEO4J_USERNAME: "${NEO4J_USERNAME:-neo4j}"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:-change-me}"
      NEO4J_DATABASE: "${NEO4J_DATABASE:-neo4j}"
      ENTITY_GRAPH_ENABLED: "${ENTITY_GRAPH_ENABLED:-1}"
      ES_HOST: "http://elasticsearch:9200"
      ENGINE_HOST: "0.0.0.0"
      ENGINE_PORT: "5180"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      milvus:
        condition: service_started
      elasticsearch:
        condition: service_healthy
    volumes:
      - uploads_data:/app/backend/uploads

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      args:
        PIP_INDEX_URL: "${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}"
    env_file:
      - .env
    environment:
      DATABASE_URL: "mysql+pymysql://root:${MYSQL_ROOT_PASSWORD:-CHANGE-ME}@mysql:3306/${MYSQL_DATABASE:-prism_db}?charset=utf8mb4"
      REDIS_URL: "redis://redis:6379/0"
      MILVUS_HOST: "milvus"
      MILVUS_PORT: "19530"
      NEO4J_URI: "${NEO4J_URI:-bolt://neo4j:7687}"
      NEO4J_USERNAME: "${NEO4J_USERNAME:-neo4j}"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:-change-me}"
      NEO4J_DATABASE: "${NEO4J_DATABASE:-neo4j}"
      ENTITY_GRAPH_ENABLED: "${ENTITY_GRAPH_ENABLED:-1}"
      ES_HOST: "http://elasticsearch:9200"
      KMC_HOST: "0.0.0.0"
      KMC_PORT: "5175"
      ENGINE_HOST: "0.0.0.0"
      ENGINE_PORT: "5180"
      ENGINE_BASE_URL: "http://engine:5180"
      SKIP_ENGINE: "1"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      engine:
        condition: service_started
    volumes:
      - uploads_data:/app/backend/uploads

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "${PRISM_HTTP_PORT:-8080}:80"
    depends_on:
      - backend
      - engine

volumes:
  mysql_data:
  redis_data:
  etcd_data:
  minio_data:
  milvus_data:
  neo4j_data:
  es_data:
  uploads_data:
