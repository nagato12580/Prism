# prism/docker-compose.yml
version: "3.8"
services:
  mysql:
    image: mysql:8.0
    ports: ["13306:3306"]
    environment:
      MYSQL_ROOT_PASSWORD: "CHANGE-ME"
      MYSQL_DATABASE: "prism_db"
    # Reuse the populated local data volume; do not create an empty per-worktree MySQL volume.
    volumes: ["prism_mysql_data:/var/lib/mysql"]

  redis:
    image: redis:7-alpine
    ports: ["16379:6379"]

  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes: ["etcd_data:/etcd"]
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health", "--endpoints=http://127.0.0.1:2379"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: minio server /minio_data
    ports: ["9001:9000"]
    volumes: ["minio_data:/minio_data"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  milvus:
    image: milvusdb/milvus:v2.4.0
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes: ["milvus_data:/var/lib/milvus"]

  neo4j:
    image: neo4j:5.26.0
    environment:
      NEO4J_AUTH: neo4j/password
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes: ["neo4j_data:/data"]

  attu:
    image: zilliz/attu:v2.4
    ports:
      - "8000:3000"
    depends_on:
      - milvus

  elasticsearch:
    build: ./docker/es
    image: prism-es-ik:8.17.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=${ES_JAVA_OPTS:--Xms512m -Xmx512m}
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

  faster-whisper:
    build: ./docker/faster-whisper
    image: prism-whisper:latest
    ports:
      - "5199:5199"
    environment:
      - WHISPER_MODEL_SIZE=small
      - WHISPER_DEVICE=cpu
      - WHISPER_COMPUTE=int8
    restart: unless-stopped

volumes:
  prism_mysql_data:
    external: true
  etcd_data:
  minio_data:
  milvus_data:
  neo4j_data:
  es_data:
