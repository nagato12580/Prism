services:
  mysql:
    image: mysql:8.0
    command:
      - --default-authentication-plugin=mysql_native_password
      - --innodb-buffer-pool-size=256M
      - --innodb-log-file-size=64M
      - --max-connections=80
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-change-me}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-prism_db}"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-change-me}"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no", "--save", "900", "1", "--save", "300", "10"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "2147483648"
    command:
      - etcd
      - -advertise-client-urls=http://etcd:2379
      - -listen-client-urls
      - http://0.0.0.0:2379
      - --data-dir
      - /etcd
    volumes:
      - etcd_data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health", "--endpoints=http://127.0.0.1:2379"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-change-me}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-change-me}"
    command: minio server /minio_data --console-address ":9001"
    volumes:
      - minio_data:/minio_data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s
    restart: unless-stopped

  milvus:
    image: milvusdb/milvus:v2.4.0
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - milvus_data:/var/lib/milvus
    restart: unless-stopped

  neo4j:
    image: neo4j:5.26.28
    environment:
      NEO4J_AUTH: "${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:-change-me}"
      NEO4J_initial_dbms_default__database: "${NEO4J_DATABASE:-neo4j}"
      NEO4J_server_memory_heap_initial__size: "${NEO4J_HEAP_INITIAL:-512m}"
      NEO4J_server_memory_heap_max__size: "${NEO4J_HEAP_MAX:-512m}"
      NEO4J_server_memory_pagecache_size: "${NEO4J_PAGECACHE_SIZE:-256m}"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  elasticsearch:
    build: ./docker/es
    image: prism-es-ik:8.17.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "${ES_JAVA_OPTS:--Xms768m -Xmx768m}"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 >/dev/null || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  engine:
    build:
      context: .
      dockerfile: docker/engine.Dockerfile
      args:
        PIP_INDEX_URL: "${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}"
    env_file:
      - .env.ecs-full
    environment:
      DATABASE_URL: "mysql+pymysql://root:${MYSQL_ROOT_PASSWORD:-change-me}@mysql:3306/${MYSQL_DATABASE:-prism_db}?charset=utf8mb4"
      REDIS_URL: "redis://redis:6379/0"
      MILVUS_HOST: "milvus"
      MILVUS_PORT: "19530"
      NEO4J_URI: "${NEO4J_URI:-bolt://neo4j:7687}"
      NEO4J_USERNAME: "${NEO4J_USERNAME:-neo4j}"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:-change-me}"
      NEO4J_DATABASE: "${NEO4J_DATABASE:-neo4j}"
      ES_HOST: "http://elasticsearch:9200"
      ENGINE_HOST: "0.0.0.0"
      ENGINE_PORT: "5180"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_started
      neo4j:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    volumes:
      - uploads_data:/app/backend/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5180/health >/dev/null || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 20
      start_period: 40s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      args:
        PIP_INDEX_URL: "${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}"
    env_file:
      - .env.ecs-full
    environment:
      DATABASE_URL: "mysql+pymysql://root:${MYSQL_ROOT_PASSWORD:-change-me}@mysql:3306/${MYSQL_DATABASE:-prism_db}?charset=utf8mb4"
      REDIS_URL: "redis://redis:6379/0"
      MILVUS_HOST: "milvus"
      MILVUS_PORT: "19530"
      NEO4J_URI: "${NEO4J_URI:-bolt://neo4j:7687}"
      NEO4J_USERNAME: "${NEO4J_USERNAME:-neo4j}"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:-change-me}"
      NEO4J_DATABASE: "${NEO4J_DATABASE:-neo4j}"
      ES_HOST: "http://elasticsearch:9200"
      KMC_HOST: "0.0.0.0"
      KMC_PORT: "5175"
      ENGINE_HOST: "0.0.0.0"
      ENGINE_PORT: "5180"
      ENGINE_BASE_URL: "http://engine:5180"
      SKIP_ENGINE: "1"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      engine:
        condition: service_healthy
    volumes:
      - uploads_data:/app/backend/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5175/health >/dev/null || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 20
      start_period: 40s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "${PRISM_HTTP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
      engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ >/dev/null || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 20
      start_period: 20s
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
  etcd_data:
  minio_data:
  milvus_data:
  neo4j_data:
  es_data:
  uploads_data:
